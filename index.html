
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="35-Day Cut">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230d0d0d'/%3E%3Ctext x='50%25' y='58%25' dominant-baseline='middle' text-anchor='middle' font-size='260' font-family='Arial' font-weight='900' fill='%23c9a84c'%3E35%3C/text%3E%3C/svg%3E">
<title>35-Day Beach Cut</title>
<style>
:root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--gold:#c9a84c;--gold2:#e8c96a;--text:#f0ece4;--muted:#888;--good:#3ecf8e;--danger:#ff453a}
*{box-sizing:border-box;margin:0;padding:0}html{color-scheme:dark light;-webkit-text-size-adjust:100%}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:0 auto;padding:16px 16px 96px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;background:linear-gradient(180deg,rgba(13,13,13,.98),rgba(13,13,13,.86));backdrop-filter:blur(12px);z-index:20;padding:14px 0 12px}.brand{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.tabs{display:flex;gap:8px;margin:12px 0 16px}.tab{flex:1;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--muted);font-weight:800}.tab.active{background:var(--gold);color:#000;border-color:var(--gold)}.panel{display:none}.panel.active{display:block}.hero,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#1a1505,#0d0d0d);border-color:#6f5a24}.day-title{font-size:24px;font-weight:900}.badge{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;background:rgba(201,168,76,.15);color:var(--gold);border:1px solid #6f5a24;font-weight:700;font-size:13px}.muted{color:var(--muted)}.item{border:1px solid var(--border);border-radius:14px;background:#111;margin-bottom:8px;overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}.name{font-weight:800}.meta{font-size:12px;color:var(--muted)}.tip{display:none;padding:0 14px 12px;color:var(--muted)}.tip .inner{padding:10px 12px;background:#0a0a0a;border-radius:10px;border-left:3px solid #6f5a24}.meal{display:grid;gap:8px}.meal select,.steps,.week input{width:100%;background:#111;border:1px solid var(--border);border-radius:12px;padding:11px 12px;color:var(--text)}.bar{height:12px;background:#111;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2))}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;font-weight:800;background:#111}.done{background:#0f2b1e;border-color:var(--good);color:var(--good)}.today{border-color:var(--gold);color:var(--gold)}.lock{display:none;padding:14px;border-radius:14px;background:#0f2b1e;border:1px solid var(--good);color:var(--good);text-align:center;font-weight:800}.install{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:40;background:linear-gradient(135deg,#1a1505,#151109);border:1px solid #6f5a24;border-radius:18px;padding:14px}.install button{width:100%;padding:12px;border-radius:12px;border:0;font-weight:900}.install .yes{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}.install .no{margin-top:8px;background:#222;color:var(--muted);border:1px solid var(--border)}@media (min-width:700px){.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.top{padding-top:20px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">35-Day Cut</div><div class="muted" id="todayLabel"></div></div>
  <div class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="progress">Progress</button><button class="tab" data-tab="weight">Weight</button></div>
  <div class="panel active" id="today"></div>
  <div class="panel" id="progress">
    <div class="card"><div style="display:flex;gap:10px;justify-content:space-between;text-align:center"><div style="flex:1"><div id="doneNum" style="font-size:30px;font-weight:900"></div><div class="muted" style="font-size:12px">Days Done</div></div><div style="flex:1"><div id="streakNum" style="font-size:30px;font-weight:900"></div><div class="muted" style="font-size:12px">Streak</div></div><div style="flex:1"><div id="leftNum" style="font-size:30px;font-weight:900"></div><div class="muted" style="font-size:12px">Left</div></div></div></div>
    <div class="card"><div style="font-weight:800;margin-bottom:10px">Completion</div><div class="bar"><div id="barFill"></div></div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)"><span id="barDone"></span><span id="barLeft"></span></div></div>
    <div class="card"><div style="font-weight:800;margin-bottom:10px">35-Day Grid</div><div class="grid" id="grid"></div></div>
  </div>
  <div class="panel" id="weight"></div>
</div>
<div class="install" id="installBox"><div style="font-weight:900;margin-bottom:8px">Install this app</div><div class="muted" style="font-size:13px;margin-bottom:10px">Add to your home screen for offline use.</div><button class="yes" id="installBtn">Install</button><button class="no" id="dismissBtn">Not now</button></div>
<script>
const START = new Date('2026-05-16T00:00:00');
const DAYS = ['Upper A','Lower A','Active Recovery','Upper B','Lower B','Walk & Mobility','Rest'];
const DATA = Array.from({length:35}, (_,i)=>({day:i+1,date:new Date(START.getTime()+i*86400000),title:DAYS[i%7],kcal:[2300,2200,2150,2300,2200,2150,2100][i%7],tip:['Train hard. No half reps.','Stay strict. Every set counts.','Recover well. Stretch and walk.','Push the pace. You chose this.','Own every rep. Make them count.','Walk and breathe. Active rest.','Rest is training. Eat clean today.'][i%7]}));
const MEALS={breakfast:[['80g oats + whey + banana',480],['3 eggs + egg whites + toast',430],['Greek yogurt + berries + oats + whey',420],['Skyr + granola + banana + whey',450]],lunch:[['Chicken + rice + veg',520],['Turkey + potatoes + salad',490],['Tuna bowl + rice + salad',470],['Lean beef wrap + salad',510]],pre:[['1 banana',90],['2 rice cakes + whey',180],['Whey shake',120],['None',0]],dinner:[['Lean beef + potatoes + veg',560],['Chicken salad + olive oil',490],['Salmon + rice + veg',530],['Turkey + sweet potato + broccoli',500]],bed:[['Skyr / Greek yogurt',100],['Whey shake',120],['Nothing',0]]};
const WEEKS=['16 May','23 May','30 May','06 Jun','13 Jun'];
const EX={0:[['Chest Press','4x8-12','32kg','Elbows at 45deg, full range, slow eccentric.'],['Lat Pulldown','4x8-12','15kg','Pull to upper chest, squeeze lats.'],['Seated Row','3x10-12','20kg','Pinch shoulder blades at end.'],['Shoulder Press','3x10','12kg','Core tight, no back arch.'],['Lateral Raises','3x15','6kg','Lead elbows, no momentum.'],['Triceps Pressdown','3x12','15kg','Elbows pinned, full extension.'],['Biceps Curl','3x12','10kg','No swing, slow on way down.'],['Incline Walk Finisher','20min','—','7-8% incline, 5.5-6 km/h.']],1:[['Leg Press','4x8-12','20kg','Drive through heels, full depth.'],['Romanian Deadlift','3x8-10','20kg','Hinge hips, neutral spine.'],['Leg Curl','3x10-12','18kg','Control the return every rep.'],['Leg Extension','3x12','18kg','Slow up and down, no slamming.'],['Calf Raises','4x15','20kg','Full stretch at bottom, pause at top.'],['Plank','3x30sec','—','Ribs down, glutes squeezed.'],['Incline Walk Finisher','15min','—','Keep the pace consistent.']],3:[['Incline Chest Press','4x8-10','28kg','30-45deg incline, full stretch.'],['One-Arm Row','4x8-12/side','20kg','Pull elbow to hip, no rotation.'],['Rear Delt Fly','3x15','6kg','Squeeze hard at the top.'],['Face Pulls','3x15','10kg','Pull to nose, elbows high.'],['Lateral Raises','3x15','6kg','Controlled, no bounce.'],['Triceps Overhead','3x12','10kg','Keep elbows close.'],['Hammer Curl','3x12','10kg','Neutral grip, smooth reps.'],['Incline Walk Finisher','20min','—','Hold the pace.']],4:[['Hack Squat / Squat','4x8-10','20kg','Depth below parallel, knees track toes.'],['Hip Thrust','4x10-12','20kg','Squeeze glutes at top lockout.'],['Walking Lunges','3x10/leg','10kg','Tall posture, push through front heel.'],['Abductor Machine','3x15-20','32kg','Lean forward, squeeze wide.'],['Leg Extension','2x12','18kg','Light and controlled only.'],['Dead Bug','3x10','—','Lower back pressed flat to floor.'],['Incline Walk Finisher','15min','—','Finish the session strong.']]};
let state=JSON.parse(localStorage.getItem('35cut')||'{"days":{},"weight":{}}');
let deferredPrompt=null;
function save(){localStorage.setItem('35cut',JSON.stringify(state));}
function tdIdx(){const t=new Date();const d=Math.floor((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(2026,4,16))/86400000);return Math.max(0,Math.min(34,d));}
function fmt(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});}
function calcCalories(i){let t=0;document.querySelectorAll('.mealSel[data-day="'+i+'"]').forEach(s=>{const o=s.options[s.selectedIndex];t+=+(o?.dataset.cal||0);});const ov=document.querySelector('.calOverride[data-day="'+i+'"]');if(ov&&ov.value)t=+ov.value;const el=document.getElementById('cal_'+i);if(el)el.textContent=t+' kcal';}
function mealHTML(i){const keys=['breakfast','lunch','pre','dinner','bed'];let h='<div class="card"><div style="font-weight:800;margin-bottom:10px">🥩 Meals</div><div class="meal">';keys.forEach(k=>{h+='<select class="mealSel" data-day="'+i+'" data-meal="'+k+'"><option value="" data-cal="0">— '+k+' —</option>';MEALS[k].forEach((m,j)=>{h+='<option value="'+j+'" data-cal="'+m[1]+'">'+m[0]+' ('+m[1]+' kcal)</option>';});h+='</select>';});h+='<input type="number" class="calOverride" data-day="'+i+'" placeholder="Override total kcal"><div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px"><span class="muted">Target: <b style="color:var(--gold)">'+DATA[i].kcal+' kcal</b></span><span id="cal_'+i+'">0 kcal</span></div></div></div>';return h;}
function exHTML(i){const sets=EX[i%7]||null;if(!sets)return '<div class="card"><div style="font-weight:800;margin-bottom:8px">🏋️ Training</div><div class="muted">Recovery or rest day. Walk, stretch, breathe.</div></div>';return '<div class="card"><div style="font-weight:800;margin-bottom:10px">🏋️ Training</div>'+sets.map((s,j)=>'<div class="item"><div class="row"><label style="display:flex;align-items:center;gap:10px;flex:1"><input type="checkbox" class="ex" data-day="'+i+'" data-ex="'+j+'" style="width:20px;height:20px;accent-color:#c9a84c"><div><div class="name">'+s[0]+'</div><div class="meta">'+s[1]+' · '+s[2]+'</div></div></label><button class="tipBtn" data-day="'+i+'" data-i="'+j+'" style="color:var(--muted);background:none;border:0;font-size:22px">›</button></div><div class="tip" id="tip_'+i+'_'+j+'"><div class="inner">💡 '+s[3]+'</div></div></div>').join('')+'</div>';}
function dayPanel(){const i=tdIdx();const d=DATA[i];document.getElementById('today').innerHTML='<div class="hero"><div class="day-title">Day '+d.day+'</div><div class="muted">'+fmt(d.date)+'</div><div class="badge">'+d.title+'</div><div style="margin-top:12px;border-left:3px solid #6f5a24;padding-left:12px;color:var(--muted);font-style:italic">"'+d.tip+'"</div></div>'+exHTML(i)+mealHTML(i)+'<div class="card"><div style="font-weight:800;margin-bottom:10px">📋 Checklist</div><div style="display:grid;gap:8px"><label style="display:flex;align-items:center;gap:10px;padding:10px;background:#111;border-radius:12px"><input type="checkbox" class="chk" data-day="'+i+'" data-key="water" style="width:20px;height:20px;accent-color:#c9a84c"> Drank 2.5–3L water</label><label style="display:flex;align-items:center;gap:10px;padding:10px;background:#111;border-radius:12px"><input type="checkbox" class="chk" data-day="'+i+'" data-key="steps" style="width:20px;height:20px;accent-color:#c9a84c"> Hit daily steps</label><label style="display:flex;align-items:center;gap:10px;padding:10px;background:#111;border-radius:12px"><input type="checkbox" class="chk" data-day="'+i+'" data-key="protein" style="width:20px;height:20px;accent-color:#c9a84c"> Protein at every meal</label><label style="display:flex;align-items:center;gap:10px;padding:10px;background:#111;border-radius:12px"><input type="checkbox" class="chk" data-day="'+i+'" data-key="alcohol" style="width:20px;height:20px;accent-color:#c9a84c"> Zero alcohol</label><label style="display:flex;align-items:center;gap:10px;padding:10px;background:#111;border-radius:12px"><input type="checkbox" class="chk" data-day="'+i+'" data-key="sleep" style="width:20px;height:20px;accent-color:#c9a84c"> 8h sleep</label></div></div><div class="card"><div style="font-weight:800;margin-bottom:10px">👟 Steps</div><input type="number" class="steps" id="steps_'+i+'" placeholder="Log today steps"></div><button id="completeBtn" style="width:100%;padding:15px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;font-weight:900;font-size:16px;margin-top:4px">Mark Day '+d.day+' Complete</button><div class="lock" id="locked">✅ Day '+d.day+' complete. Locked.</div>';restoreDay(i);}
function restoreDay(i){const d=state.days[i]||{};document.querySelectorAll('.ex').forEach(el=>{if(+el.dataset.day===i&&d.ex)el.checked=!!d.ex[el.dataset.ex];});document.querySelectorAll('.chk').forEach(el=>{if(+el.dataset.day===i)el.checked=!!d[el.dataset.key];});document.querySelectorAll('.mealSel').forEach(el=>{if(+el.dataset.day===i&&d.meals&&d.meals[el.dataset.meal]!==undefined)el.value=d.meals[el.dataset.meal];});const oc=document.querySelector('.calOverride[data-day="'+i+'"]');if(oc&&d.override)oc.value=d.override;const st=document.getElementById('steps_'+i);if(st&&d.steps)st.value=d.steps;calcCalories(i);if(d.locked){document.getElementById('completeBtn').style.display='none';document.getElementById('locked').style.display='block';document.querySelectorAll('#today input,#today select,#today button').forEach(b=>{if(b.id!=='locked')b.disabled=true;});}}
function renderProgress(){const done=Object.values(state.days).filter(d=>d.locked).length;let streak=0;for(let i=tdIdx();i>=0;i--){if(state.days[i]&&state.days[i].locked)streak++;else break;}document.getElementById('doneNum').textContent=done;document.getElementById('streakNum').textContent=streak;document.getElementById('leftNum').textContent=35-done;document.getElementById('barFill').style.width=((done/35)*100)+'%';document.getElementById('barDone').textContent=done+' done';document.getElementById('barLeft').textContent=(35-done)+' left';const g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<35;i++){const c=document.createElement('div');c.className='cell'+((state.days[i]&&state.days[i].locked)?' done':'')+(i===tdIdx()?' today':'');c.textContent=i+1;g.appendChild(c);}}
function renderWeight(){const w=document.getElementById('weight');w.innerHTML=WEEKS.map((x,i)=>'<div class="card"><div style="font-weight:800;margin-bottom:10px">Week '+(i+1)+' — '+x+'</div><input type="number" step="0.1" placeholder="kg" id="w_'+(i+1)+'" value="'+(state.weight[i+1]||'')+'"><div id="delta_'+(i+1)+'" class="muted" style="margin-top:8px"></div></div>').join('');for(let i=2;i<=5;i++){const prev=parseFloat(state.weight[i-1]);const cur=parseFloat(state.weight[i]);const el=document.getElementById('delta_'+i);if(el){el.textContent=prev&&cur?((cur-prev).toFixed(1)+' kg '+(cur<=prev?'↓ down':'↑ up')):'—';el.style.color=cur<=prev?'var(--good)':'var(--danger)';}}
return;}
document.body.addEventListener('click',e=>{if(e.target.classList.contains('tipBtn')){const id='tip_'+e.target.dataset.day+'_'+e.target.dataset.i;const el=document.getElementById(id);if(el)el.style.display=el.style.display==='block'?'none':'block';}if(e.target.classList.contains('ex')||e.target.classList.contains('chk')){const day=+e.target.dataset.day;state.days[day]=state.days[day]||{};if(e.target.classList.contains('ex')){state.days[day].ex=state.days[day].ex||{};state.days[day].ex[e.target.dataset.ex]=e.target.checked;}else{state.days[day][e.target.dataset.key]=e.target.checked;}save();}if(e.target.id==='completeBtn'){const i=tdIdx();state.days[i]=state.days[i]||{};state.days[i].locked=true;save();document.getElementById('completeBtn').style.display='none';document.getElementById('locked').style.display='block';document.querySelectorAll('#today input,#today select,#today button').forEach(b=>{if(b.id!=='locked')b.disabled=true;});renderProgress();}if(e.target.id==='installBtn'){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}document.getElementById('installBox').style.display='none';}if(e.target.id==='dismissBtn'){document.getElementById('installBox').style.display='none';}});
document.body.addEventListener('change',e=>{if(e.target.classList.contains('mealSel')){const i=+e.target.dataset.day;state.days[i]=state.days[i]||{};state.days[i].meals=state.days[i].meals||{};state.days[i].meals[e.target.dataset.meal]=e.target.value;save();calcCalories(i);}if(e.target.classList.contains('calOverride')){const i=+e.target.dataset.day;state.days[i]=state.days[i]||{};state.days[i].override=e.target.value;save();calcCalories(i);}if(e.target.classList.contains('steps')){const i=+e.target.id.replace('steps_','');state.days[i]=state.days[i]||{};state.days[i].steps=e.target.value;save();}if(e.target.id&&e.target.id.startsWith('w_')){const i=+e.target.id.replace('w_','');state.weight[i]=e.target.value;save();renderWeight();}});
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(btn.dataset.tab).classList.add('active');if(btn.dataset.tab==='today')dayPanel();if(btn.dataset.tab==='progress')renderProgress();if(btn.dataset.tab==='weight')renderWeight();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setTimeout(()=>document.getElementById('installBox').style.display='block',1500);});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.getElementById('todayLabel').textContent=fmt(new Date());
dayPanel();renderProgress();renderWeight();
</script>
</body>
</html>
